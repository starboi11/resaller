route:
  receiver: default
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # The Compose stack mounts this private URL from .secrets. A deployment
    # without it must fail its preflight rather than silently dropping alerts.
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
