groups:
  - name: resaller
    rules:
      - alert: ResallerApiDown
        expr: up{job="resaller-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Resaller API is unavailable" }
      - alert: SellerAcceptanceOverdue
        expr: resaller_orders_acceptance_overdue > 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Seller acceptance deadline worker is behind" }
      - alert: NotificationDeliveryFailures
        expr: resaller_notification_deliveries_failed > 0
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Notification deliveries are failing" }
      - alert: NotificationQueueBacklog
        expr: resaller_notification_queue_scheduled > 100
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Notification queue backlog is growing" }
      - alert: SecurityReviewBacklog
        expr: resaller_security_events_unreviewed > 20
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Security review backlog needs attention" }
