services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment: { DOMAIN: '${DOMAIN}' }
    ports: ['80:80', '443:443']
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, admin, api]
  web:
    build:
      {
        context: .,
        dockerfile: infrastructure/Dockerfile.web,
        args: { NEXT_PUBLIC_API_URL: 'https://${DOMAIN}/api/v1' },
      }
    restart: unless-stopped
    environment: { NEXT_PUBLIC_API_URL: 'https://${DOMAIN}/api/v1' }
  admin:
    build:
      {
        context: .,
        dockerfile: infrastructure/Dockerfile.admin,
        args: { NEXT_PUBLIC_API_URL: 'https://${DOMAIN}/api/v1' },
      }
    restart: unless-stopped
    environment: { NEXT_PUBLIC_API_URL: 'https://${DOMAIN}/api/v1' }
  api:
    build: { context: ., dockerfile: infrastructure/Dockerfile.api }
    restart: unless-stopped
    command:
      [
        'sh',
        '-c',
        'pnpm --filter @resaller/api db:migrate:deploy && pnpm --filter @resaller/api start',
      ]
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: 'postgresql://resaller:${POSTGRES_PASSWORD}@postgres:5432/resaller?schema=public'
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: '${SESSION_SECRET}'
      CORS_ORIGINS: 'https://${DOMAIN},https://admin.${DOMAIN}'
      LOG_LEVEL: info
      MEDIA_ROOT: /app/data/media
      PRIVATE_MEDIA_ROOT: /app/data/private-media
      MEDIA_STORAGE_DRIVER: '${MEDIA_STORAGE_DRIVER:-local}'
      S3_ENDPOINT: '${S3_ENDPOINT:-http://localhost:9000}'
      S3_REGION: '${S3_REGION:-auto}'
      S3_BUCKET: '${S3_BUCKET:-resaller-media}'
      S3_PRIVATE_BUCKET: '${S3_PRIVATE_BUCKET:-resaller-private-media}'
      S3_ACCESS_KEY_ID: '${S3_ACCESS_KEY_ID:-local-unused}'
      S3_SECRET_ACCESS_KEY: '${S3_SECRET_ACCESS_KEY:-local-unused}'
      S3_FORCE_PATH_STYLE: '${S3_FORCE_PATH_STYLE:-true}'
      EMAIL_WEBHOOK_URL: '${EMAIL_WEBHOOK_URL:-}'
      EMAIL_WEBHOOK_TOKEN: '${EMAIL_WEBHOOK_TOKEN:-}'
      TELEGRAM_BOT_TOKEN: '${TELEGRAM_BOT_TOKEN:-}'
      PUSH_WEBHOOK_URL: '${PUSH_WEBHOOK_URL:-}'
      PUSH_WEBHOOK_TOKEN: '${PUSH_WEBHOOK_TOKEN:-}'
      METRICS_TOKEN: '${METRICS_TOKEN}'
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_started }
    volumes:
      - media_prod:/app/data/media
      - private_media_prod:/app/data/private-media
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: resaller
      POSTGRES_USER: resaller
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
    volumes: ['postgres_prod:/var/lib/postgresql/data']
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U resaller -d resaller'],
        interval: 10s,
        timeout: 5s,
        retries: 10,
      }
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: ['redis_prod:/data']
    healthcheck:
      {
        test: ['CMD', 'redis-cli', 'ping'],
        interval: 10s,
        timeout: 3s,
        retries: 10,
      }
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes: ['clamav_data:/var/lib/clamav']
  backup:
    build: { context: ., dockerfile: infrastructure/Dockerfile.backup }
    restart: unless-stopped
    environment:
      DATABASE_URL: 'postgresql://resaller:${POSTGRES_PASSWORD}@postgres:5432/resaller'
      BACKUP_ENCRYPTION_KEY: '${BACKUP_ENCRYPTION_KEY}'
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: '${BACKUP_RETENTION_DAYS:-14}'
      BACKUP_S3_ENDPOINT: '${BACKUP_S3_ENDPOINT:-}'
      BACKUP_S3_BUCKET: '${BACKUP_S3_BUCKET:-}'
      AWS_ACCESS_KEY_ID: '${BACKUP_S3_ACCESS_KEY_ID:-}'
      AWS_SECRET_ACCESS_KEY: '${BACKUP_S3_SECRET_ACCESS_KEY:-}'
      AWS_DEFAULT_REGION: '${BACKUP_S3_REGION:-auto}'
    command: ['sh', '-c', 'while true; do resaller-backup; sleep 86400; done']
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - encrypted_backups:/backups
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yml',
        '--storage.tsdb.retention.time=30d',
      ]
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - ./.secrets/metrics_token:/run/secrets/metrics_token:ro
      - prometheus_data:/prometheus
    depends_on: [api, alertmanager]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ['--config.file=/etc/alertmanager/alertmanager.yml']
    volumes:
      - ./infrastructure/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
volumes:
  postgres_prod:
  redis_prod:
  caddy_data:
  media_prod:
  private_media_prod:
  encrypted_backups:
  clamav_data:
  prometheus_data:
  alertmanager_data:
