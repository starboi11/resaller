services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment: { DOMAIN: "${DOMAIN}" }
    ports: ["80:80", "443:443"]
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, admin, api]
  web:
    build: { context: ., dockerfile: infrastructure/Dockerfile.web, args: { NEXT_PUBLIC_API_URL: "https://${DOMAIN}/api/v1" } }
    restart: unless-stopped
    environment: { NEXT_PUBLIC_API_URL: "https://${DOMAIN}/api/v1" }
  admin:
    build: { context: ., dockerfile: infrastructure/Dockerfile.admin, args: { NEXT_PUBLIC_API_URL: "https://${DOMAIN}/api/v1" } }
    restart: unless-stopped
    environment: { NEXT_PUBLIC_API_URL: "https://${DOMAIN}/api/v1" }
  api:
    build: { context: ., dockerfile: infrastructure/Dockerfile.api }
    restart: unless-stopped
    command: ["sh", "-c", "pnpm --filter @resaller/api db:migrate:deploy && pnpm --filter @resaller/api start"]
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: "postgresql://resaller:${POSTGRES_PASSWORD}@postgres:5432/resaller?schema=public"
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: "${SESSION_SECRET}"
      CORS_ORIGINS: "https://${DOMAIN},https://admin.${DOMAIN}"
      LOG_LEVEL: info
      MEDIA_ROOT: /app/data/media
      PRIVATE_MEDIA_ROOT: /app/data/private-media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - media_prod:/app/data/media
      - private_media_prod:/app/data/private-media
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: resaller
      POSTGRES_USER: resaller
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes: ["postgres_prod:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U resaller -d resaller"], interval: 10s, timeout: 5s, retries: 10 }
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: ["redis_prod:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 10 }
volumes:
  postgres_prod:
  redis_prod:
  caddy_data:
  media_prod:
  private_media_prod:
