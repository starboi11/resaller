services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment: { DOMAIN: '${DOMAIN:?DOMAIN is required}', ADMIN_BASE_PATH: '${ADMIN_BASE_PATH:?ADMIN_BASE_PATH is required}' }
    ports: ['80:80', '443:443']
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, admin, api]
  web:
    build:
      {
        context: .,
        dockerfile: infrastructure/Dockerfile.web,
        args: { NEXT_PUBLIC_API_URL: 'https://${DOMAIN}/api/v1' },
      }
    restart: unless-stopped
    environment: { NEXT_PUBLIC_API_URL: 'https://${DOMAIN}/api/v1' }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  admin:
    build:
      {
        context: .,
        dockerfile: infrastructure/Dockerfile.admin,
        args: { NEXT_PUBLIC_API_URL: 'https://${DOMAIN}/api/v1', ADMIN_BASE_PATH: '${ADMIN_BASE_PATH:?ADMIN_BASE_PATH is required (node scripts/generate-admin-path.mjs)}' },
      }
    restart: unless-stopped
    # basePath is read again by `next start`: the secret path must also be in
    # the runtime environment, and the image refuses to start without it.
    environment: { NEXT_PUBLIC_API_URL: 'https://${DOMAIN}/api/v1', ADMIN_BASE_PATH: '${ADMIN_BASE_PATH:?ADMIN_BASE_PATH is required}', ADMIN_REQUIRE_BASE_PATH: 'true' }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001${ADMIN_BASE_PATH}/owner').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  api:
    build: { context: ., dockerfile: infrastructure/Dockerfile.api }
    restart: unless-stopped
    command:
      [
        'sh',
        '-c',
        'pnpm --filter @resaller/api db:migrate:deploy && pnpm --filter @resaller/api start',
      ]
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: 'postgresql://resaller:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/resaller?schema=public'
      REDIS_URL: 'redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379'
      SESSION_SECRET: '${SESSION_SECRET:?SESSION_SECRET is required}'
      DATA_ENCRYPTION_KEY: '${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}'
      PUBLIC_WEB_URL: 'https://${DOMAIN}'
      TRUST_PROXY: 'true'
      CORS_ORIGINS: 'https://${DOMAIN},https://admin.${DOMAIN}'
      LOG_LEVEL: info
      MEDIA_ROOT: /app/data/media
      PRIVATE_MEDIA_ROOT: /app/data/private-media
      MEDIA_STORAGE_DRIVER: s3
      S3_ENDPOINT: '${S3_ENDPOINT:?S3_ENDPOINT is required}'
      S3_REGION: '${S3_REGION:-auto}'
      S3_BUCKET: '${S3_BUCKET:?S3_BUCKET is required}'
      S3_PRIVATE_BUCKET: '${S3_PRIVATE_BUCKET:?S3_PRIVATE_BUCKET is required}'
      S3_ACCESS_KEY_ID: '${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}'
      S3_SECRET_ACCESS_KEY: '${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}'
      S3_FORCE_PATH_STYLE: '${S3_FORCE_PATH_STYLE:-true}'
      EMAIL_WEBHOOK_URL: '${EMAIL_WEBHOOK_URL:?EMAIL_WEBHOOK_URL is required}'
      EMAIL_WEBHOOK_TOKEN: '${EMAIL_WEBHOOK_TOKEN:?EMAIL_WEBHOOK_TOKEN is required}'
      TELEGRAM_SUPPORT_ENABLED: '${TELEGRAM_SUPPORT_ENABLED:-false}'
      TELEGRAM_BOT_TOKEN: '${TELEGRAM_BOT_TOKEN:-}'
      TELEGRAM_WEBHOOK_SECRET: '${TELEGRAM_WEBHOOK_SECRET:-}'
      TELEGRAM_SUPPORT_CHAT_ID: '${TELEGRAM_SUPPORT_CHAT_ID:-}'
      TELEGRAM_SUPPORT_OPERATOR_NAME: '${TELEGRAM_SUPPORT_OPERATOR_NAME:-Resaller Support}'
      TELEGRAM_WEBHOOK_URL: '${TELEGRAM_WEBHOOK_URL:-}'
      PUSH_WEBHOOK_URL: '${PUSH_WEBHOOK_URL:-}'
      PUSH_WEBHOOK_TOKEN: '${PUSH_WEBHOOK_TOKEN:-}'
      METRICS_TOKEN: '${METRICS_TOKEN:?METRICS_TOKEN is required}'
      OWNER_STORE_USERNAME: '${OWNER_STORE_USERNAME:?OWNER_STORE_USERNAME is required}'
      ADMIN_TWO_FACTOR_REQUIRED: '${ADMIN_TWO_FACTOR_REQUIRED:-true}'
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }
    volumes:
      - media_prod:/app/data/media
      - private_media_prod:/app/data/private-media
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: resaller
      POSTGRES_USER: resaller
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}'
    volumes: ['postgres_prod:/var/lib/postgresql/data']
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U resaller -d resaller'],
        interval: 10s,
        timeout: 5s,
        retries: 10,
      }
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment: { REDIS_PASSWORD: '${REDIS_PASSWORD:?REDIS_PASSWORD is required}' }
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: ['redis_prod:/data']
    healthcheck:
      {
        test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping'],
        interval: 10s,
        timeout: 3s,
        retries: 10,
      }
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes: ['clamav_data:/var/lib/clamav']
    healthcheck:
      test: ['CMD', 'clamdscan', '--ping', '1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
  backup:
    build: { context: ., dockerfile: infrastructure/Dockerfile.backup }
    restart: unless-stopped
    environment:
      DATABASE_URL: 'postgresql://resaller:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/resaller'
      BACKUP_ENCRYPTION_KEY: '${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY is required}'
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: '${BACKUP_RETENTION_DAYS:-14}'
      BACKUP_S3_ENDPOINT: '${BACKUP_S3_ENDPOINT:?BACKUP_S3_ENDPOINT is required}'
      BACKUP_S3_BUCKET: '${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET is required}'
      AWS_ACCESS_KEY_ID: '${BACKUP_S3_ACCESS_KEY_ID:?BACKUP_S3_ACCESS_KEY_ID is required}'
      AWS_SECRET_ACCESS_KEY: '${BACKUP_S3_SECRET_ACCESS_KEY:?BACKUP_S3_SECRET_ACCESS_KEY is required}'
      AWS_DEFAULT_REGION: '${BACKUP_S3_REGION:-auto}'
    command: ['sh', '-c', 'set -e; while true; do resaller-backup; sleep 86400; done']
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - encrypted_backups:/backups
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yml',
        '--storage.tsdb.retention.time=30d',
      ]
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - ./.secrets/metrics_token:/run/secrets/metrics_token:ro
      - prometheus_data:/prometheus
    depends_on: [api, alertmanager]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ['--config.file=/etc/alertmanager/alertmanager.yml']
    volumes:
      - ./infrastructure/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./.secrets/alertmanager_webhook_url:/run/secrets/alertmanager_webhook_url:ro
      - alertmanager_data:/alertmanager
volumes:
  postgres_prod:
  redis_prod:
  caddy_data:
  media_prod:
  private_media_prod:
  encrypted_backups:
  clamav_data:
  prometheus_data:
  alertmanager_data:
