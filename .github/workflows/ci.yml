name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @resaller/api db:validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: pnpm --filter @resaller/api db:migrate:deploy
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: pnpm security:secrets
      - run: pnpm test:deployment
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ci-session-secret-at-least-32-characters
          CORS_ORIGINS: http://localhost:3000
          RUN_DB_TESTS: '1'
          RUN_REDIS_TESTS: '1'
          REDIS_TEST_URL: redis://localhost:6379/15
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Committed visual baselines are Windows captures. Keep Linux functional
      # coverage; capture/review Linux baselines before enabling visual CI here.
      - run: pnpm test:e2e --grep-invert "visual baseline|layout baseline"
        env:
          E2E_USE_PRODUCTION_BUILDS: 'true'
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ci-session-secret-at-least-32-characters
          CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
      - run: pnpm audit --prod --audit-level high
