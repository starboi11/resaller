packages:
  - apps/*
  - packages/*

overrides:
  deepmerge-ts: 8.0.0
  mysql2: 3.23.1
  fast-uri@^3: 3.1.8
  fast-uri@^4: 4.1.5
  ip-address: 10.7.1
  fastify: 5.12.5

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - '@types/node@22.20.2'
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
  - zod@4.6.1

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
